<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn New Character</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📚 Teach Me a New Football Character</h1>
            <p>Help me learn about someone new! I’ll ask questions next time.</p>
            {% if error %}
            <div class="alert alert-danger" style="padding: 10px; margin: 15px 0; border-radius: 8px; background-color: #ffebee; color: #c62828; border-left: 4px solid #f44336;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="learn-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required placeholder="e.g., Cristiano Ronaldo">
                </div>
                <!-- Add this after "Description" -->
                <div class="form-group">
                    <label for="age_group">Age Group (optional):</label>
                    <select id="age_group" name="age_group" class="form-control">
                        <option value="">-- Select --</option>
                        <option value="under_18">Under 18</option>
                        <option value="18_23">18–23</option>
                        <option value="23_35">23–35</option>
                        <option value="over_35">Over 35</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="image_url">Image URL :</label>
                    <input type="text" id="image_url" name="image_url" placeholder="https://example.com/ronaldo.jpg">
                </div>

                <div class="form-group">
                    <label for="description">Description :</label>
                    <textarea id="description" name="description" rows="4" placeholder="e.g., Portuguese footballer, plays for Al Nassr, former Real Madrid star..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary">💾 Save & Learn</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">🏠 Back to Home</a>
            </form>
        </div>
    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 15px;
            text-align: center;
        }

        .card p {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
        }

        .learn-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 16px;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background: #9E9E9E;
            color: white;
        }

        .btn-secondary:hover {
            background: #757575;
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            .card {
                padding: 20px;
            }

            .card h1 {
                font-size: 24px;
            }
        }
    </style>
</body>
</html>
