<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mind Reader - Teach Me</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            text-align: center;
            padding: 50px;
            color: #333;
        }
        h1 { font-size: 2.5em; margin-bottom: 20px; }
        form { margin-top: 30px; }
        input[type="text"] {
            padding: 12px;
            font-size: 1em;
            border: 2px solid #ccc;
            border-radius: 6px;
            width: 250px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <h1>😔 I couldn’t guess correctly!</h1>
    <p>Help me learn. Who were you thinking of?</p>

    <form action="{{ url_for('teach') }}" method="post">
        <input type="text" name="name" placeholder="Enter the correct character" required>
        <br>
        <input type="text" name="answers" placeholder="What are some correct answers? (comma-separated)" required>
        <br>
        <button type="submit">Teach Me</button>
    </form>
</body>
</html>
