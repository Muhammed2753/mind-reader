<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind Reader - Start</title>
  <style>
    body {
      font-family: Times new roman, Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      max-width: 90%;
      margin-bottom: 40px;
    }

    button {
      background-color: #4CAF50;
      border: none;
      padding: 15px 40px;
      border-radius: 10px;
      color: white;
      font-size: 1.2rem;
      font-family: Times new roman;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      p { font-size: 1rem; }
      button { width: 80%; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>Welcome to Mind Reader ⚽</h1>
  <p>Think of any Football Player, Manager, or Club Owner — I’ll try to guess it!</p>
  <form action="{{ url_for('start') }}" method="post">
    <button type="submit">Start Game</button>
  </form>
</body>
</html>
